name: Record BC claims tutorial

on:
  pull_request:
    paths:
      - "scripts/record-bc-claim-search.mjs"
      - ".github/workflows/record-bc-claims-tutorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record tutorial
        run: node scripts/record-bc-claim-search.mjs

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert to MP4
        run: ffmpeg -y -i tutorial-output/bc-mineral-claims-search.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart tutorial-output/bc-mineral-claims-search.mp4

      - name: Generate continuous neural voiceover
        run: |
          python3 -m venv .voice-venv
          .voice-venv/bin/pip install edge-tts==7.2.3
          .voice-venv/bin/edge-tts \
            --voice en-CA-LiamNeural \
            --rate=-8% \
            --text "Here's how to search British Columbia mineral claims using Exploration Maps. Start by selecting Search B C mineral claims from the available tools. British Columbia Mineral Titles Online is selected automatically, so you're ready to search. You can look up claims by company, claim number, or map sheet. For this example, enter Dolly Varden Silver and run the search. Select the matching area from the results, then add those claims directly to your map. They're now ready for you to style, review in context, or export for your next step." \
            --write-media tutorial-output/voiceover-continuous.mp3

      - name: Tighten narration pacing
        run: |
          ffmpeg -y \
            -i tutorial-output/voiceover-continuous.mp3 \
            -af "silenceremove=start_periods=1:start_duration=0.05:start_threshold=-38dB:start_silence=0.08:stop_periods=-1:stop_duration=0.18:stop_threshold=-38dB:stop_silence=0.10" \
            -c:a libmp3lame -b:a 192k tutorial-output/voiceover-paced.mp3

      - name: Mix natural voiceover into MP4
        run: |
          ffmpeg -y \
            -i tutorial-output/bc-mineral-claims-search.mp4 \
            -i tutorial-output/voiceover-paced.mp3 \
            -filter_complex "[1:a]adelay=450:all=1,volume=0.94,apad[voice]" \
            -map 0:v:0 -map "[voice]" -c:v copy -c:a aac -b:a 192k -shortest \
            tutorial-output/bc-mineral-claims-search-natural-voiceover.mp4

      - name: Upload tutorial videos
        uses: actions/upload-artifact@v4
        with:
          name: bc-mineral-claims-tutorial
          path: |
            tutorial-output/bc-mineral-claims-search-natural-voiceover.mp4
            tutorial-output/bc-mineral-claims-search.mp4
            tutorial-output/bc-mineral-claims-search.webm
          if-no-files-found: error
          retention-days: 7
