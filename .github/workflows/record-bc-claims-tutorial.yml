name: Record BC claims tutorial

on:
  pull_request:
    paths:
      - "scripts/record-bc-claim-search.mjs"
      - "scripts/generate-bc-claim-voiceover.py"
      - ".github/workflows/record-bc-claims-tutorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Record tutorial and caption timing
        run: node scripts/record-bc-claim-search.mjs

      - name: Convert to MP4
        run: ffmpeg -y -i tutorial-output/bc-mineral-claims-search.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart tutorial-output/bc-mineral-claims-search.mp4

      - name: Generate natural voiceover from exact script
        run: |
          python3 -m venv .voice-venv
          .voice-venv/bin/pip install "kokoro==0.9.4" "soundfile>=0.12" "numpy<3"
          .voice-venv/bin/python scripts/generate-bc-claim-voiceover.py

      - name: Mix timestamped voiceover into MP4
        run: |
          ffmpeg -y \
            -i tutorial-output/bc-mineral-claims-search.mp4 \
            -i tutorial-output/voiceover-natural.wav \
            -filter_complex "[1:a]volume=0.96,apad[voice]" \
            -map 0:v:0 -map "[voice]" -c:v copy -c:a aac -b:a 192k -shortest \
            tutorial-output/bc-mineral-claims-search-natural-synced.mp4

      - name: Upload tutorial videos
        uses: actions/upload-artifact@v4
        with:
          name: bc-mineral-claims-tutorial
          path: |
            tutorial-output/bc-mineral-claims-search-natural-synced.mp4
            tutorial-output/bc-mineral-claims-search.mp4
            tutorial-output/narration-cues.json
          if-no-files-found: error
          retention-days: 7
