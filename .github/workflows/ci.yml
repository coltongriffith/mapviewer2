name: CI

# Gates ordinary changes on install / test / build. Previously the only
# workflows drove data and social pipelines, so a failing test or a broken
# build could reach production unchallenged (audit P0-10).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` requires the committed lockfile and installs it exactly —
      # this is what makes the build reproducible across machines.
      - name: Install (locked)
        run: npm ci

      # Errors fail the build; the accessibility/unused-variable backlog is
      # reported as warnings so it stays visible without blocking unrelated work.
      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      # Bundle and image budgets: stops silent size regression (P1-22/23).
      - name: Performance budgets
        run: npm run budgets

      # Auth is tree-shaken from the anonymous test build. Check the configured
      # import graph too; these placeholders are not credentials and build
      # commands never make an auth request.
      - name: Configured auth bundle budgets
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-check-placeholder
        run: |
          npx vite build --outDir dist-auth-check
          node scripts/check-budgets.mjs dist-auth-check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # Real browser against the real build, served with vercel.json semantics
      # so routing, 404s and security headers are covered too (P1-14).
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Build configured admin client
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-check-placeholder
        run: npx vite build --outDir dist-auth-check
      - name: Admin browser flows (isolated auth and data fixtures)
        run: npm run test:e2e:admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Fail only on high/critical advisories in production dependencies —
      # dev-only and low findings should not block a deploy.
      - name: Dependency policy
        run: npm audit --omit=dev --audit-level=high


  publish-mcp-registry:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 233 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate ./server.json

      - name: Verify production MCP endpoint
        run: |
          BODY='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          STATUS=$(curl -sS -o /tmp/mcp-response.json -w "%{http_code}" \
            -X POST "https://www.explorationmaps.com/mcp/server" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: server/discover" \
            --data "$BODY")
          cat /tmp/mcp-response.json
          test "$STATUS" = "200"
          grep -q '"supportedVersions"' /tmp/mcp-response.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish ExplorationMaps
        run: ./mcp-publisher publish ./server.json
