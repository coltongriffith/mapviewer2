name: CI

# Gates ordinary changes on install / test / build. Previously the only
# workflows drove data and social pipelines, so a failing test or a broken
# build could reach production unchallenged (audit P0-10).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` requires the committed lockfile and installs it exactly —
      # this is what makes the build reproducible across machines.
      - name: Install (locked)
        run: npm ci

      # Errors fail the build; the accessibility/unused-variable backlog is
      # reported as warnings so it stays visible without blocking unrelated work.
      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      # Bundle and image budgets: stops silent size regression (P1-22/23).
      - name: Performance budgets
        run: npm run budgets

      # Auth is tree-shaken from the anonymous test build. Check the configured
      # import graph too; these placeholders are not credentials and build
      # commands never make an auth request.
      - name: Configured auth bundle budgets
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-check-placeholder
        run: |
          npx vite build --outDir dist-auth-check
          node scripts/check-budgets.mjs dist-auth-check

  # Each suite keeps its original config and test selection. fullyParallel
  # partitions individual tests across three standard runners per suite.
  e2e_shards:
    name: browser (${{ matrix.suite }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [anonymous, admin]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build anonymous client
        if: matrix.suite == 'anonymous'
        run: npm run build
      - name: Build configured admin client
        if: matrix.suite == 'admin'
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build-check-placeholder
        run: |
          node scripts/generate-blog.js
          npx vite build --outDir dist-auth-check
      # Keep the real build and vercel.json semantics in both suites.
      - name: Browser smoke tests
        if: matrix.suite == 'anonymous'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - name: Admin browser flows (isolated auth and data fixtures)
        if: matrix.suite == 'admin'
        run: npm run test:e2e:admin -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.suite }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Preserve the required e2e check name. A failed, cancelled or skipped
  # matrix must never turn into a green gate just because this job can run.
  e2e:
    if: ${{ always() }}
    needs: e2e_shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.e2e_shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Browser shards did not all pass: $SHARD_RESULT"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Fail only on high/critical advisories in production dependencies —
      # dev-only and low findings should not block a deploy. When npm's advisory
      # endpoint itself is down (503, timeout), retry; a real finding fails at once.
      - name: Dependency policy
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high > audit.log 2>&1; then cat audit.log; exit 0; fi
            cat audit.log
            grep -q "audit endpoint returned an error" audit.log || exit 1
            [ "$attempt" -lt 3 ] && echo "npm audit endpoint unavailable; retrying in $((attempt * 30))s" && sleep $((attempt * 30))
          done
          exit 1
