<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="520" viewBox="0 0 1600 520"
     role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Exploration Maps</title>
  <desc id="logo-desc">A stepped mineral-claim matrix crossed by a geological channel, with one copper claim selected.</desc>

  <!--
    Production palette
    Mineral Slate: #142126
    Claim Copper: #C65322
    Channel:      #FFFFFF
    Background is transparent.
  -->

  <g id="claim-matrix-mark">
    <!-- Compact cadastral territory -->
    <path fill="#142126"
          d="M60 40H180V85H410V250H445V480H30V385H60Z"/>

    <!-- Geological channel: context to target, then into depth -->
    <path fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linecap="butt" stroke-linejoin="miter"
          d="M18 180H132L205 250H240V325L320 400V490"/>

    <!-- Branch into the selected claim -->
    <path fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linecap="butt" stroke-linejoin="miter"
          d="M205 250L260 195"/>

    <!-- Claim chamber and selected parcel -->
    <rect x="250" y="145" width="90" height="90" fill="#FFFFFF"/>
    <rect x="273" y="168" width="44" height="44" fill="#C65322"/>
  </g>

  <!-- Editable wordmark. Segoe UI is preferred; Helvetica/Arial are safe fallbacks. -->
  <text x="520" y="310"
        fill="#142126"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="128"
        font-weight="300"
        letter-spacing="-1.5">
    <tspan>Exploration</tspan><tspan dx="22" font-weight="600">Maps</tspan>
  </text>
</svg>
